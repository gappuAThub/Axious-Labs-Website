  <path d="M16 29.5H32" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- AI / Network Vertices Nodes -->
  <!-- Apex Node -->
  <circle cx="24" cy="6" r="3" fill="#38BDF8" filter="url(#glow)"/>
  <circle cx="24" cy="6" r="1.5" fill="#FFFFFF"/>
  
  <!-- Left Leg Node -->
  <circle cx="16" cy="29.5" r="2.5" fill="#38BDF8"/>
  <circle cx="16" cy="29.5" r="1.2" fill="#FFFFFF"/>
  
  <!-- Right Leg Node -->
  <circle cx="32" cy="29.5" r="2.5" fill="#A855F7"/>
  <circle cx="32" cy="29.5" r="1.2" fill="#FFFFFF"/>
  
  <!-- Center Core Node -->
  <circle cx="24" cy="29.5" r="2.8" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="24" cy="29.5" r="1.2" fill="#6366F1"/>
  
  <!-- Base Corner Nodes -->
  <circle cx="10.5" cy="38" r="2" fill="#6366F1"/>
